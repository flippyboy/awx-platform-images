# Steady-cadence policy for agent-assisted pin bumps and *per-component* releases.
schema_version: 1

# How often to open "propose pins" PRs (human or agent merges)
propose_schedule:
  # GitHub Actions cron (UTC)
  cron: "0 9 * * 1"   # Mondays 09:00 UTC
  description: "Weekly pin proposal against ansible/* development branches (devel or main) and floating image digests"

# Each publishable image has its own version track and git tag prefix.
# Git tag:  <component>-vX.Y.Z
# Image:    ghcr.io/flippyboy/awx/<component>:X.Y.Z
release_tracks:
  platform-ui:
    tag_prefix: "platform-ui-v"
    image: ghcr.io/flippyboy/awx/platform-ui
    cut_when:
      - "ansible-ui pin commit SHA changed since last platform-ui release"
      - "docker/platform-ui/** or UI patches changed"
      - "manual workflow_dispatch"
    depends_on_upstream: [ansible-ui]

  jewel-with-ui:
    tag_prefix: "jewel-with-ui-v"
    image: ghcr.io/flippyboy/awx/jewel-with-ui
    cut_when:
      - "jewel pin, public_image, or public_image_digest changed since last jewel-with-ui release"
      - "docker/jewel/** changed"
      - "published platform-ui version intentionally bumped for rebake"
      - "manual workflow_dispatch"
    depends_on_upstream: [jewel]
    # Does not rebuild platform-ui; pulls published.platform-ui (or override)
    bakes: platform-ui

  awx:
    tag_prefix: "awx-v"
    image: ghcr.io/flippyboy/awx/awx
    enabled_when: "components.awx.build is true"
    cut_when:
      - "awx pin changed and build is enabled"
      - "manual workflow_dispatch"
    depends_on_upstream: [awx]

  # Operator repo is separate; document handoff only
  operator_handoff:
    repo: awx-platform-operator
    action: >-
      Open PR bumping only the changed image(s) in chart values +
      release/pins.consumer.yaml (other components keep their pins)

# Agent decision preferences (non-binding guidance)
agent_preferences:
  prefer_commit_sha_over_branch: true
  # Annotated tags are for *our* releases (platform-ui-v*), not upstream pins.
  prefer_annotated_tags_when_present: true
  # Prefer releasing only components whose upstream pins actually moved
  independent_component_releases: true
  max_components_changed_per_release: 1
  avoid_refs:
    - "HEAD"
    - "latest"   # as a git ref; jewel's *image* tag :latest is the development line
    - "stable"
  # Upstream semver tags (awx 24.6.x, ansible-ui v2.4.x) lag devel/main by years.
  # New features land on the development branch. Pin that tip's commit SHA.
  track_development_branch: true
  development_branch_order: [devel, main, master]
  # Public images: digest of the floating development tag, never a stable version.
  public_image_tags:
    awx: devel
    jewel: latest   # no :devel image; :latest tracks jewel devel
