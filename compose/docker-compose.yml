# AWX modernization stack: Controller (AWX) + Jewel (gateway) + Platform UI
#
#   make build && make up
#   open https://localhost  (Envoy — Platform UI + JWT to Controller)
#   https://localhost:8000 is Jewel-only (no /api/controller proxy)
#
# Components:
#   - postgres          shared PostgreSQL (awx + gateway DBs)
#   - redis-awx         Redis for controller
#   - redis-jewel       Redis for jewel (TCP, no TLS for compose)
#   - controller-web    AWX API / web
#   - controller-task   AWX task workers
#   - receptor          job execution mesh (local work type)
#   - jewel             gateway API + platform UI
#   - envoy             reverse proxy (dynamic routes from jewel)
#   - bootstrap         one-shot service registration

name: awx-compose

x-awx-env: &awx-env
  DATABASE_NAME: awx
  DATABASE_USER: ${DATABASE_USER:-awx}
  DATABASE_PASSWORD: ${DATABASE_PASSWORD:-awx}
  DATABASE_HOST: postgres
  DATABASE_PORT: "5432"
  REDIS_HOST: redis-awx
  REDIS_PORT: "6379"
  AWX_LOGGING_MODE: stdout
  DJANGO_SUPERUSER_USERNAME: ${ADMIN_USER:-admin}
  DJANGO_SUPERUSER_PASSWORD: ${ADMIN_PASSWORD:-admin}
  DJANGO_SUPERUSER_EMAIL: admin@localhost
  RECEPTORCTL_SOCKET: /var/run/receptor/receptor.sock
  # Jewel JWT trust (public key fetched from Jewel at this URL)
  ANSIBLE_BASE_JWT_KEY: ${ANSIBLE_BASE_JWT_KEY:-https://jewel:8000}
  ANSIBLE_BASE_JWT_VALIDATE_CERT: "false"
  # Shared secret for Controller → Jewel resource registry (file preferred)
  RESOURCE_SERVER_URL: ${RESOURCE_SERVER_URL:-https://jewel:8000}
  RESOURCE_SERVER_SECRET_KEY: ${RESOURCE_SERVER_SECRET_KEY:-}
  RESOURCE_SERVER_SECRET_KEY_FILE: /etc/tower/conf.d/controller_service_secret

x-awx-volumes: &awx-volumes
  - ./config/awx/settings.py:/etc/tower/conf.d/settings.py:ro
  - ./secrets/awx_secret_key:/etc/tower/SECRET_KEY:ro
  - ./config/awx/nginx.conf:/etc/nginx/nginx.conf:ro
  - ./secrets/tls.crt:/etc/nginx/pki/web.crt:ro
  - ./secrets/tls.key:/etc/nginx/pki/web.key:ro
  - ./config/awx/receptor.conf:/etc/receptor/receptor.conf:ro
  # Written by bootstrap (generate_service_secret); empty file ok until then
  - ./secrets/controller_service_secret:/etc/tower/conf.d/controller_service_secret:ro
  - receptor-sock:/var/run/receptor
  - awx-projects:/var/lib/awx/projects
  - ./scripts/entrypoint-awx-web.sh:/usr/local/bin/entrypoint-awx-web.sh:ro
  - ./scripts/entrypoint-awx-task.sh:/usr/local/bin/entrypoint-awx-task.sh:ro

services:
  # ---------------------------------------------------------------------------
  # Data stores
  # ---------------------------------------------------------------------------
  postgres:
    image: ${POSTGRES_IMAGE:-mirror.gcr.io/library/postgres:15}
    environment:
      POSTGRES_USER: ${DATABASE_USER:-awx}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-awx}
      POSTGRES_DB: awx
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./config/postgres/init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-awx}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [awx]

  redis-awx:
    image: ${REDIS_IMAGE:-mirror.gcr.io/library/redis:7.4}
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./config/awx/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [awx]

  redis-jewel:
    image: ${REDIS_IMAGE:-mirror.gcr.io/library/redis:7.4}
    command: ["redis-server", "--bind", "0.0.0.0", "--protected-mode", "no", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [awx]

  # ---------------------------------------------------------------------------
  # AWX Controller
  # ---------------------------------------------------------------------------
  controller-web:
    image: ${AWX_IMAGE:-ghcr.io/ansible/awx:devel}
    user: "1000"
    environment:
      <<: *awx-env
      RUN_MIGRATIONS: "1"
    volumes: *awx-volumes
    entrypoint: ["bash", "/usr/local/bin/entrypoint-awx-web.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      redis-awx:
        condition: service_healthy
    ports:
      - "${CONTROLLER_HTTP_PORT:-8052}:8052"
      - "${CONTROLLER_HTTPS_PORT:-8043}:8043"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8052/api/v2/ping/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 90s
    networks: [awx]

  controller-task:
    image: ${AWX_IMAGE:-ghcr.io/ansible/awx:devel}
    user: "1000"
    environment:
      <<: *awx-env
      RUN_MIGRATIONS: "0"
    volumes: *awx-volumes
    entrypoint: ["bash", "/usr/local/bin/entrypoint-awx-task.sh"]
    depends_on:
      controller-web:
        condition: service_healthy
      redis-awx:
        condition: service_healthy
      receptor:
        condition: service_started
    networks: [awx]

  receptor:
    image: ${RECEPTOR_IMAGE:-quay.io/ansible/receptor:latest}
    user: "0"
    command: ["receptor", "--config", "/etc/receptor/receptor.conf"]
    volumes:
      - ./config/awx/receptor.conf:/etc/receptor/receptor.conf:ro
      - receptor-sock:/var/run/receptor
    networks: [awx]

  # ---------------------------------------------------------------------------
  # Platform UI (standalone — also baked into jewel image)
  # ---------------------------------------------------------------------------
  platform-ui:
    image: ${PLATFORM_UI_IMAGE:-awx-compose/platform-ui:local}
    build:
      context: .
      dockerfile: docker/platform-ui/Dockerfile
    profiles: ["ui-standalone"]
    ports:
      - "4100:8080"
    networks: [awx]

  # ---------------------------------------------------------------------------
  # Jewel gateway (+ platform UI)
  # ---------------------------------------------------------------------------
  jewel:
    image: ${JEWEL_IMAGE:-awx-compose/jewel:local}
    build:
      context: .
      dockerfile: docker/jewel/Dockerfile
      args:
        JEWEL_BASE: ${JEWEL_BASE_IMAGE:-ghcr.io/ansible/jewel:latest}
        UI_IMAGE: ${PLATFORM_UI_IMAGE:-awx-compose/platform-ui:local}
    user: "1000"
    environment:
      DJANGO_SETTINGS_MODULE: aap_gateway_api.settings
      DATABASE_NAME: gateway
      DATABASE_USER: ${DATABASE_USER:-awx}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-awx}
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      # Non-TLS Redis for compose simplicity
      REDIS_URL: redis://redis-jewel:6379/0
      REDIS_TLS: "false"
      REDIS_MODE: standalone
      REDIS_HOSTS: redis-jewel:6379
      REDIS_SSL_CERT_REQS: none
      CACHE_KEY_PREFIX: gateway
      ENVOY_HOSTNAME: envoy
      ENVOY_VERIFY_HTTPS_CERTIFICATES: "false"
      CONTAINER_NUMBER: "1"
      SECRET_KEY: ignored-use-file
    volumes:
      - ./secrets/jewel_secret_key:/etc/ansible-automation-platform/gateway/SECRET_KEY:ro
      - ./secrets/tls.crt:/etc/ansible-automation-platform/gateway/gateway.crt:ro
      - ./secrets/tls.key:/etc/ansible-automation-platform/gateway/gateway.key:ro
      - ./config/jewel/settings.py:/etc/ansible-automation-platform/gateway/settings.py:ro
      - ./config/jewel/container-startup.yml:/opt/aap_gateway/src/container-startup.yml:ro
      - ./scripts/entrypoint-jewel.sh:/usr/local/bin/entrypoint-jewel.sh:ro
    entrypoint: ["bash", "/usr/local/bin/entrypoint-jewel.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      redis-jewel:
        condition: service_healthy
    ports:
      - "${JEWEL_PORT:-8000}:8000"
      - "50051:50051"
    healthcheck:
      test: ["CMD-SHELL", "curl -skf https://127.0.0.1:8000/api/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 90s
    networks: [awx]

  # ---------------------------------------------------------------------------
  # Envoy reverse proxy (dynamic config from Jewel xDS)
  # ---------------------------------------------------------------------------
  envoy:
    image: ${ENVOY_IMAGE:-mirror.gcr.io/envoyproxy/envoy:v1.36.6}
    command: ["--config-path", "/etc/envoy/envoy.yaml"]
    environment:
      ENVOY_UID: "0"
    volumes:
      - ./config/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./config/envoy/envoy-path-rewrite.lua:/etc/envoy/envoy-path-rewrite.lua:ro
      - ./secrets/tls.crt:/etc/ansible-automation-platform/gateway/gateway.crt:ro
      - ./secrets/tls.key:/etc/ansible-automation-platform/gateway/gateway.key:ro
    ports:
      - "${ENVOY_PORT:-443}:9080"
      - "19000:19000"
    depends_on:
      jewel:
        condition: service_healthy
    networks: [awx]

  # ---------------------------------------------------------------------------
  # One-shot: register controller with jewel
  # ---------------------------------------------------------------------------
  bootstrap:
    image: mirror.gcr.io/library/python:3.12-slim
    environment:
      JEWEL_URL: https://jewel:8000
      CONTROLLER_URL: https://controller-web:8043
      CONTROLLER_HTTP: http://controller-web:8052
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASS: ${ADMIN_PASSWORD:-admin}
    volumes:
      - ./scripts/bootstrap.sh:/bootstrap.sh:ro
    entrypoint: ["bash", "/bootstrap.sh"]
    depends_on:
      jewel:
        condition: service_healthy
      controller-web:
        condition: service_healthy
    networks: [awx]
    restart: "no"

networks:
  awx:
    driver: bridge

volumes:
  postgres-data:
  receptor-sock:
  awx-projects:
