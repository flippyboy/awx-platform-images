# Minimal static Envoy config for Jewel gateway.
# Dynamic CDS/LDS are loaded from the Jewel control plane once services are registered.
node:
  id: envoy-gateway-1
  cluster: envoy

dynamic_resources:
  cds_config:
    resource_api_version: V3
    api_config_source:
      api_type: REST
      transport_api_version: V3
      cluster_names:
        - gateway-control-plane-rest
      refresh_delay:
        seconds: 30

  lds_config:
    resource_api_version: V3
    api_config_source:
      api_type: REST
      transport_api_version: V3
      cluster_names:
        - gateway-control-plane-rest
      refresh_delay:
        seconds: 30

static_resources:
  clusters:
  - type: STRICT_DNS
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http_protocol_options: {}
    name: gateway-control-plane-rest
    connect_timeout: 5s
    load_assignment:
      cluster_name: gateway-control-plane-rest
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: jewel
                port_value: 8000
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        common_tls_context:
          validation_context:
            trust_chain_verification: ACCEPT_UNTRUSTED

  - type: STRICT_DNS
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {}
    name: gateway_control_plane
    connect_timeout: 5s
    load_assignment:
      cluster_name: gateway_control_plane
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: jewel
                port_value: 50051

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 19000
