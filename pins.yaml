# Source of truth for upstream component git refs used in image builds.
# Agents and CI must not invent forks; only pin ansible/* repositories.
#
# schema_version: 1

schema_version: 1
updated: "2026-08-26T07:20:00Z"
notes: >-
  Independent per-component releases. Prefer commit SHAs for release cuts.
  Image versions live under published.* and are cut with tags like
  platform-ui-v0.1.1 / jewel-with-ui-v0.1.1 (not a single images-v* tag).
  ansible-ui and awx track devel tips: latest GitHub semver tags (v2.4.313 /
  24.6.1) lag devel by years. Jewel has no tags; track devel.

registry:
  prefix: ghcr.io/flippyboy/awx

# Last published image versions (independent tracks — bump only what you release).
# Image tags are clean semver: ghcr.io/flippyboy/awx/<name>:<version>
published:
  platform-ui:
    version: "0.1.1"
  jewel-with-ui:
    version: "0.1.1"
    # platform-ui image version baked into the last jewel-with-ui release
    platform_ui_version: "0.1.1"
  # awx:
  #   version: "0.1.0"   # only when components.awx.build is true

components:
  awx:
    # Controller API image
    repository: https://github.com/ansible/awx.git
    ref: devel
    # Prefer setting commit for reproducible releases:
    commit: eb7090dd0f93d48d984c835639834979b5b17028
    # Build policy: use public image instead of rebuilding
    build: false
    public_image: ghcr.io/ansible/awx:devel
    # If build: true, use docker/awx or upstream Dockerfile
    image_name: awx

  jewel:
    repository: https://github.com/ansible/jewel.git
    ref: devel
    commit: b68b6cabaa2214221c7eff816b1cd9e04061b7db
    build: true
    # Base for jewel-with-ui when not building jewel from source
    public_image: ghcr.io/ansible/jewel:latest
    image_name: jewel

  ansible-ui:
    repository: https://github.com/ansible/ansible-ui.git
    ref: devel
    commit: 6fe43c634d1affa5e82ef0529f4412869c8d8fca
    build: true
    image_name: platform-ui
    # monorepo workspace for Platform UI
    workspace: platform

# Derived images (built only from pins above + this repo Dockerfiles)
derived:
  platform-ui:
    image_name: platform-ui
    depends_on: [ansible-ui]
    dockerfile: docker/platform-ui/Dockerfile
    # upstream pins that, when changed, justify a platform-ui release
    release_triggers: [ansible-ui]

  jewel-with-ui:
    image_name: jewel-with-ui
    depends_on: [jewel, ansible-ui]
    dockerfile: docker/jewel/Dockerfile
    # Uses a *published* platform-ui image tag (see published.jewel-with-ui.platform_ui_version)
    # rather than rebuilding UI in the same release by default.
    release_triggers: [jewel]
    # Also re-release when you intentionally bump platform_ui_version after a UI cut.
