schema_version: 1
updated: '2026-11-09T19:15:16Z'
notes: Independent per-component releases. Pin development-branch commit SHAs (devel,
  or main). Stable semver tags such as awx 24.6.x and ansible-ui v2.4.x lag those
  branches by years — do not pin them. public_image_digest is the registry digest
  of the floating development image (awx :devel, jewel :latest). Image versions live
  under published.* and are cut with calendar tags like platform-ui-v2026.10.21 /
  jewel-with-ui-v2026.10.21-1 (not a single images-v* tag, and not semver).
