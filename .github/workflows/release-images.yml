name: release-images

# Independent per-component releases.
#
# Git tags (calver after the component prefix):
#   platform-ui-v2026.10.21
#   jewel-with-ui-v2026.10.21-1
#   awx-v2026.10.21
#
# GHCR image tags use the same calendar version:
#   ghcr.io/flippyboy/awx/platform-ui:2026.10.21
#   ghcr.io/flippyboy/awx/jewel-with-ui:2026.10.21-1
#
# YYYY.MM.DD is the UTC date of the cut (zero-padded month and day).
# -N is a later cut the same day. N starts at 1.
#
# jewel-with-ui bakes a published platform-ui version (does not rebuild UI
# unless you release platform-ui first). Override with workflow_dispatch input
# platform_ui_version, or pins.yaml published.jewel-with-ui.platform_ui_version.

on:
  push:
    tags:
      - "platform-ui-v*"
      - "jewel-with-ui-v*"
      - "awx-v*"
  workflow_dispatch:
    inputs:
      component:
        description: Image component to build and push
        required: true
        type: choice
        options:
          - platform-ui
          - jewel-with-ui
          - awx
      version:
        description: "Calendar version YYYY.MM.DD, or YYYY.MM.DD-N for another cut the same day"
        required: true
        type: string
      platform_ui_version:
        description: "For jewel-with-ui only: platform-ui image tag to bake (default from pins.yaml)"
        required: false
        type: string
        default: ""
      create_github_release:
        description: Create a GitHub Release for this component
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/flippyboy/awx

jobs:
  release-component:
    runs-on: ubuntu-latest
    outputs:
      component: ${{ steps.meta.outputs.component }}
      version: ${{ steps.meta.outputs.version }}
      git_tag: ${{ steps.meta.outputs.git_tag }}
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml

      - name: Resolve component + version
        id: meta
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_COMPONENT: ${{ github.event.inputs.component }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_PLATFORM_UI: ${{ github.event.inputs.platform_ui_version }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os, re, sys, yaml
          from pathlib import Path

          sys.path.insert(0, "release")
          import calver
          import upstream

          event = os.environ["EVENT_NAME"]
          ref = os.environ.get("REF_NAME", "")
          prefix = os.environ.get("IMAGE_PREFIX", "ghcr.io/flippyboy/awx")

          pins = yaml.safe_load(Path("pins.yaml").read_text())
          published = pins.get("published") or {}
          comps = pins.get("components") or {}

          if event == "workflow_dispatch":
              component = os.environ["INPUT_COMPONENT"].strip()
              version = os.environ["INPUT_VERSION"].strip().lstrip("v")
              platform_ui_version = (os.environ.get("INPUT_PLATFORM_UI") or "").strip().lstrip("v")
          else:
              # tag: <component>-vYYYY.MM.DD or <component>-vYYYY.MM.DD-N
              m = re.fullmatch(r"(platform-ui|jewel-with-ui|awx)-v(.+)", ref)
              if not m:
                  print(f"::error::Tag {ref!r} does not match <component>-v<calver>", file=sys.stderr)
                  sys.exit(1)
              component, version = m.group(1), m.group(2)
              platform_ui_version = ""

          if not calver.is_calver(version):
              print(
                  f"::error::Version {version!r} must be calver YYYY.MM.DD "
                  "or YYYY.MM.DD-N (e.g. 2026.10.21 or 2026.10.21-1)",
                  file=sys.stderr,
              )
              sys.exit(1)

          if component == "awx" and not (pins.get("components") or {}).get("awx", {}).get("build"):
              print("::error::components.awx.build is false; refusing awx image release", file=sys.stderr)
              sys.exit(1)

          if component == "jewel-with-ui" and not platform_ui_version:
              jpub = published.get("jewel-with-ui") or {}
              ppub = published.get("platform-ui") or {}
              platform_ui_version = (
                  jpub.get("platform_ui_version")
                  or ppub.get("version")
                  or ""
              )
              if not platform_ui_version:
                  print(
                      "::error::jewel-with-ui needs platform_ui_version "
                      "(workflow input or pins.yaml published.*.version)",
                      file=sys.stderr,
                  )
                  sys.exit(1)

          git_tag = f"{component}-v{version}"
          image = f"{prefix}/{component}"
          sha = f"sha-{os.environ.get('GITHUB_SHA', 'unknown')[:12]}"

          def base_image(name: str, fallback: str) -> str:
              comp = comps.get(name) or {}
              public = (comp.get("public_image") or fallback).strip()
              return upstream.pinned_image_ref(public, comp.get("public_image_digest"))

          jewel_base = base_image("jewel", "ghcr.io/ansible/jewel:latest")
          awx_base = base_image("awx", "ghcr.io/ansible/awx:devel")

          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as f:
              f.write(f"component={component}\n")
              f.write(f"version={version}\n")
              f.write(f"git_tag={git_tag}\n")
              f.write(f"image={image}\n")
              f.write(f"sha_tag={sha}\n")
              f.write(f"platform_ui_version={platform_ui_version}\n")
              f.write(f"platform_ui_image={prefix}/platform-ui:{platform_ui_version}\n")
              f.write(f"release_name={component} {version}\n")
              f.write(f"jewel_base={jewel_base}\n")
              f.write(f"awx_base={awx_base}\n")

          print(f"component={component} version={version} image={image}")
          print(f"jewel_base={jewel_base}")
          print(f"awx_base={awx_base}")
          if component == "jewel-with-ui":
              print(f"baking platform-ui:{platform_ui_version}")
          PY

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build platform-ui
        if: steps.meta.outputs.component == 'platform-ui'
        run: |
          set -euo pipefail
          chmod +x scripts/prepare-ui-context.sh
          ./scripts/prepare-ui-context.sh
          CTX=.build/ui-context
          docker build -f "$CTX/docker/platform-ui/Dockerfile" \
            -t "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}" \
            -t "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_tag }}" \
            -t "${{ steps.meta.outputs.image }}:latest" \
            "$CTX"

      - name: Build jewel-with-ui
        if: steps.meta.outputs.component == 'jewel-with-ui'
        run: |
          set -euo pipefail
          UI_IMAGE="${{ steps.meta.outputs.platform_ui_image }}"
          echo "Pulling published UI image: ${UI_IMAGE}"
          docker pull "${UI_IMAGE}"
          docker build -f docker/jewel/Dockerfile \
            --build-arg JEWEL_BASE="${{ steps.meta.outputs.jewel_base }}" \
            --build-arg UI_IMAGE="${UI_IMAGE}" \
            -t "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}" \
            -t "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_tag }}" \
            -t "${{ steps.meta.outputs.image }}:latest" \
            .

      - name: Build awx
        if: steps.meta.outputs.component == 'awx'
        run: |
          set -euo pipefail
          docker build -f docker/awx/Dockerfile \
            --build-arg AWX_BASE="${{ steps.meta.outputs.awx_base }}" \
            -t "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}" \
            -t "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_tag }}" \
            -t "${{ steps.meta.outputs.image }}:latest" \
            .

      - name: Push component image
        id: push
        run: |
          set -euo pipefail
          IMG="${{ steps.meta.outputs.image }}"
          VER="${{ steps.meta.outputs.version }}"
          for t in \
            "$VER" \
            "${{ steps.meta.outputs.sha_tag }}" \
            latest
          do
            docker push "${IMG}:${t}"
          done
          ref="$(docker image inspect "${IMG}:${VER}" --format '{{index .RepoDigests 0}}')"
          digest="${ref##*@}"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not read a sha256 digest for ${IMG}:${VER} (got ${ref})"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${IMG}:{${VER},${{ steps.meta.outputs.sha_tag }},latest} ${digest}"

      - name: Write release notes stub
        id: notes
        run: |
          set -euo pipefail
          COMP="${{ steps.meta.outputs.component }}"
          VER="${{ steps.meta.outputs.version }}"
          NOTES="release/notes/${COMP}-v${VER}.md"
          mkdir -p release/notes
          if [[ -f "$NOTES" ]]; then
            echo "Using existing $NOTES"
          else
            {
              echo "# ${COMP} ${VER}"
              echo ""
              echo "Independent component release."
              echo ""
              echo "## Image"
              echo ""
              echo "\`${{ steps.meta.outputs.image }}:${VER}\`"
              echo ""
              if [[ "$COMP" == "jewel-with-ui" ]]; then
                echo "## Baked platform-ui"
                echo ""
                echo "\`${{ steps.meta.outputs.platform_ui_image }}\`"
                echo ""
              fi
              echo "## Pins"
              echo ""
              echo "See \`pins.yaml\` at commit \`${GITHUB_SHA::12}\`."
              echo ""
              echo "## Operator handoff"
              echo ""
              echo "Publishing this image dispatches \`images-released\` on"
              echo "\`awx-platform-operator\`. That workflow pins this tag and digest"
              echo "and cuts the operator release. Other component pins stay put."
              echo ""
            } > "$NOTES"
          fi
          echo "path=${NOTES}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: >
          github.event_name == 'push' ||
          github.event.inputs.create_github_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.git_tag }}
          name: ${{ steps.meta.outputs.release_name }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          # For workflow_dispatch without a pre-existing tag, create the tag at this SHA
          target_commitish: ${{ github.sha }}

  # GITHUB_TOKEN cannot start a workflow in another repository.
  # OPERATOR_RELEASE_TOKEN needs contents:write and workflow scope on
  # flippyboy/awx-platform-operator (repo + workflow on a classic token).
  handoff-operator:
    needs: release-component
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch operator release
        env:
          GH_TOKEN: ${{ secrets.OPERATOR_RELEASE_TOKEN }}
          COMPONENT: ${{ needs.release-component.outputs.component }}
          VERSION: ${{ needs.release-component.outputs.version }}
          GIT_TAG: ${{ needs.release-component.outputs.git_tag }}
          DIGEST: ${{ needs.release-component.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::error::OPERATOR_RELEASE_TOKEN is unset. The image is published, but the operator release was not started."
            exit 1
          fi
          echo "Dispatch images-released ${COMPONENT} ${VERSION} ${DIGEST}"
          gh api --method POST repos/flippyboy/awx-platform-operator/dispatches \
            -f event_type=images-released \
            -f "client_payload[component]=${COMPONENT}" \
            -f "client_payload[version]=${VERSION}" \
            -f "client_payload[digest]=${DIGEST}" \
            -f "client_payload[git_tag]=${GIT_TAG}" \
            -f "client_payload[source_sha]=${SOURCE_SHA}"
