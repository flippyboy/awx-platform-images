name: release-images

on:
  push:
    tags:
      - "images-v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # All component images under flippyboy/awx/*
  IMAGE_PREFIX: ghcr.io/flippyboy/awx

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set tags
        id: pref
        run: |
          TAG="${GITHUB_REF_NAME:-manual}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "prefix=${IMAGE_PREFIX}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml

      - name: Prepare UI build context (checkout ansible-ui @ pin)
        run: |
          chmod +x scripts/prepare-ui-context.sh
          ./scripts/prepare-ui-context.sh

      - name: Build platform-ui
        run: |
          CTX=.build/ui-context
          docker build -f "$CTX/docker/platform-ui/Dockerfile" \
            -t ${{ steps.pref.outputs.prefix }}/platform-ui:${{ steps.pref.outputs.tag }} \
            -t ${{ steps.pref.outputs.prefix }}/platform-ui:${{ steps.pref.outputs.sha }} \
            "$CTX"

      - name: Build jewel-with-ui
        run: |
          docker build -f docker/jewel/Dockerfile \
            --build-arg JEWEL_BASE=ghcr.io/ansible/jewel:latest \
            --build-arg UI_IMAGE=${{ steps.pref.outputs.prefix }}/platform-ui:${{ steps.pref.outputs.tag }} \
            -t ${{ steps.pref.outputs.prefix }}/jewel-with-ui:${{ steps.pref.outputs.tag }} \
            -t ${{ steps.pref.outputs.prefix }}/jewel-with-ui:${{ steps.pref.outputs.sha }} \
            .

      - name: Push packages under flippyboy/awx/*
        run: |
          set -euo pipefail
          PREFIX="${{ steps.pref.outputs.prefix }}"
          TAG="${{ steps.pref.outputs.tag }}"
          SHA="${{ steps.pref.outputs.sha }}"
          for img in platform-ui jewel-with-ui; do
            docker push "${PREFIX}/${img}:${TAG}"
            docker push "${PREFIX}/${img}:${SHA}"
          done
