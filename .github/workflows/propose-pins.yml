name: propose-pins

# Steady cadence: open an artifact with proposed pins for agent/human review.
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Propose pins
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp pins.yaml pins.prev.yaml
          python release/propose-pins.py \
            --pins pins.yaml \
            --out pins.proposed.yaml
          python release/render-notes.py \
            --prev pins.prev.yaml \
            --curr pins.proposed.yaml \
            --proposal \
            --github-token "$GITHUB_TOKEN" \
            --out release/notes/PROPOSED.md
          # PR reviews pins.yaml; keep the proposal file as an artifact only.
          cp pins.proposed.yaml pins.yaml
      - name: Upload proposal
        uses: actions/upload-artifact@v7
        with:
          name: pins-proposal
          path: |
            pins.proposed.yaml
            release/notes/PROPOSED.md
      - name: Create PR if changed
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(pins): propose devel/main pin update"
          title: "chore(pins): propose development-branch pins"
          body: |
            Automated proposal of **development-branch** pins (`devel` or `main`).
            Stable and semver image tags are not used — those releases are years
            behind where new features land.

            **Review before merge.** This is the input for a pinned release, not the release.

            - `pins.yaml` — tip commit of each development branch, plus `public_image_digest` of the floating `devel` / `latest` image
            - `release/notes/PROPOSED.md` — upstream commits since the current pins (the changelog) and which component tag to cut
            - Agent guide: `release/AGENTS.md`

            After review, cut only the component whose pins moved
            (`platform-ui-v*`, `jewel-with-ui-v*`) and keep the upstream commit list in its release notes.
          branch: chore/pins-proposal
          add-paths: |
            pins.yaml
            release/notes/PROPOSED.md
