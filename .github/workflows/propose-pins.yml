name: propose-pins

# Steady cadence: open an artifact with proposed pins for agent/human review.
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Propose pins
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp pins.yaml pins.prev.yaml
          python release/propose-pins.py \
            --pins pins.yaml \
            --out pins.proposed.yaml \
            --prefer-semver-tags
          python release/render-notes.py \
            --prev pins.prev.yaml \
            --curr pins.proposed.yaml \
            --proposal \
            --out release/notes/PROPOSED.md
          # PR reviews pins.yaml; keep the proposal file as an artifact only.
          cp pins.proposed.yaml pins.yaml
      - name: Upload proposal
        uses: actions/upload-artifact@v7
        with:
          name: pins-proposal
          path: |
            pins.proposed.yaml
            release/notes/PROPOSED.md
      - name: Create PR if changed
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(pins): weekly proposed pin update"
          title: "chore(pins): weekly proposed update"
          body: |
            Automated pin proposal. **Review before merge.** This is not a release.

            - `pins.yaml` has proposed upstream SHAs/tags
            - Draft notes: `release/notes/PROPOSED.md`
            - Agent guide: `release/AGENTS.md`

            Cut component tags (`platform-ui-v*`, `jewel-with-ui-v*`) only after review.
          branch: chore/pins-proposal
          add-paths: |
            pins.yaml
            release/notes/PROPOSED.md
